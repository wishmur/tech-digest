name: Daily Tech Digest

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 10 AM ET during EDT. Switch to "0 15 * * *" for 10 AM EST in winter.
  workflow_dispatch:

permissions:
  contents: write   # required so the job can commit the updated data file

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node index.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated digest data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update digest data"
          file_pattern: data/digest.json
