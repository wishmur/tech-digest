name: Daily Tech Digest

on:
  schedule:
    # 14:00 UTC = 10:00 AM ET during EDT (mid-Mar to early Nov).
    # In EST (winter) this runs at 9 AM ET; change to "0 15 * * *" if you want 10 AM year-round in winter.
    - cron: "0 14 * * *"
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab for manual test runs

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node index.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRAMER_API_KEY: ${{ secrets.FRAMER_API_KEY }}
          FRAMER_PROJECT_URL: ${{ secrets.FRAMER_PROJECT_URL }}
